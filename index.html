<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14231F" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" />
    <title>Saldo</title>
    <style>
      :root {
        --bg: #e9eeec;
        --ink: #14231f;
        --card: #fff;
        --in: #1b7f5c;
        --out: #b4372f;
        --mute: #5b6b66;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1815;
          --ink: #e6efec;
          --card: #16251f;
          --mute: #8fa39c;
          --in: #4cc08f;
          --out: #f07b70;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
        display: flex;
        flex-direction: column;
        max-width: 480px;
        margin: auto;
      }
      header {
        padding: 28px 0 8px;
        color: var(--mute);
        font-size: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      button.link {
        background: none;
        border: 0;
        color: var(--mute);
        font: inherit;
        text-decoration: underline;
        padding: 8px 0;
      }
      .bal {
        font-size: clamp(44px, 15vw, 68px);
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 8px 0 28px;
        font-variant-numeric: tabular-nums;
      }
      .bal.neg {
        color: var(--out);
      }
      .panel {
        background: var(--card);
        border-radius: 20px;
        padding: 20px;
      }
      label {
        font-size: 14px;
        color: var(--mute);
      }
      input {
        width: 100%;
        font: inherit;
        font-size: 28px;
        font-weight: 600;
        padding: 12px 0;
        border: 0;
        border-bottom: 2px solid var(--mute);
        background: none;
        color: var(--ink);
        outline: none;
        margin-top: 4px;
      }
      input:focus-visible {
        border-color: var(--ink);
      }
      .row {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }
      .row button {
        flex: 1;
        font: inherit;
        font-size: 18px;
        font-weight: 600;
        padding: 16px;
        border: 0;
        border-radius: 14px;
        color: #fff;
        cursor: pointer;
      }
      #gasto {
        background: var(--out);
      }
      #ingreso {
        background: var(--in);
      }
      .row button:active {
        transform: scale(0.97);
      }
      #msg {
        min-height: 24px;
        margin-top: 14px;
        font-size: 14px;
        color: var(--mute);
      }
    </style>
  </head>
  <body>
    <header>
      <span>Saldo disponible</span
      ><button class="link" id="reset">Cambiar saldo inicial</button>
    </header>
    <div class="bal" id="bal" aria-live="polite">$ 0,00</div>
    <div class="panel">
      <label for="monto">Monto</label>
      <input
        id="monto"
        type="number"
        inputmode="decimal"
        min="0"
        step="0.01"
        placeholder="0,00"
      />
      <div class="row">
        <button id="gasto">Gasté</button>
        <button id="ingreso">Recibí</button>
      </div>
      <div id="msg"></div>
    </div>
    <script>
      const KEY = "saldo_v1";
      const fmt = new Intl.NumberFormat("es", {
        style: "currency",
        currency: "USD",
        currencyDisplay: "narrowSymbol",
      });
      // Estado: dinero en centavos (enteros) para evitar errores de decimales.
      // tx[] ya se guarda: base para historial y categorías (cat) a futuro.
      let state = load();
      function load() {
        try {
          const s = JSON.parse(localStorage.getItem(KEY));
          if (s && s.v === 1) return s;
        } catch (e) {}
        return null;
      }
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(state));
        } catch (e) {}
      }
      const $ = (id) => document.getElementById(id);
      function toCents(v) {
        return Math.round(parseFloat(String(v).replace(",", ".")) * 100);
      }
      function askInitial() {
        const v = prompt("¿Con cuánto dinero empezás?", "0");
        const c = toCents(v);
        if (v === null || isNaN(c)) return !!state;
        state = {
          v: 1,
          balance: c,
          tx: [
            {
              id: Date.now(),
              type: "init",
              amount: c,
              cat: null,
              ts: Date.now(),
            },
          ],
        };
        save();
        return true;
      }
      function render() {
        const b = $("bal");
        b.textContent = fmt.format(state.balance / 100);
        b.classList.toggle("neg", state.balance < 0);
      }
      function apply(type) {
        const c = toCents($("monto").value);
        if (!(c > 0)) {
          $("msg").textContent = "Ingresá un monto mayor a 0.";
          return;
        }
        state.balance += type === "in" ? c : -c;
        state.tx.push({
          id: Date.now(),
          type,
          amount: c,
          cat: null,
          ts: Date.now(),
        });
        save();
        render();
        $("msg").textContent =
          (type === "in" ? "Sumado: " : "Descontado: ") + fmt.format(c / 100);
        $("monto").value = "";
        $("monto").focus();
      }
      $("gasto").onclick = () => apply("out");
      $("ingreso").onclick = () => apply("in");
      $("reset").onclick = () => {
        if (askInitial()) render();
      };
      if (!state) askInitial();
      if (!state) state = { v: 1, balance: 0, tx: [] };
      render();
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js");
    </script>
  </body>
</html>
